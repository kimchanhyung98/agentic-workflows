name: PR Title Check

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - labeled
      - unlabeled

permissions:
  pull-requests: read

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - name: Check bot user
        id: bot-check
        env:
          PR_USER_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          if [[ "$PR_USER_TYPE" == "Bot" ]]; then
            echo "✓ Bot user detected - skipping validation"
            echo "is_bot=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_bot=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate semantic PR title
        id: semantic-title
        if: steps.bot-check.outputs.is_bot != 'true'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail

          fail() {
            local message="$1"
            echo "error_message=$message" >> "$GITHUB_OUTPUT"
            echo "$message"
            exit 1
          }

          label_csv=",$PR_LABELS,"
          if [[ "$label_csv" == *",bot,"* || "$label_csv" == *",ignore-semantic-pull-request,"* ]]; then
            echo "Skipping semantic PR title validation because an ignore label is present."
            exit 0
          fi

          # WIP blocking is handled by the existing WIP check or draft PR state.
          # This validator stays read-only and does not create pending statuses.
          allowed_types='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)$'
          header_pattern='^([a-z]+)(\(([^)]+)\))?(!)?: ([a-z].*)$'

          if [[ ! "$PR_TITLE" =~ $header_pattern ]]; then
            echo "Invalid PR title: $PR_TITLE"
            echo "Expected: type(scope): subject or type: subject"
            echo "The subject must start with a lowercase character."
            fail "Invalid PR title format"
          fi

          type="${BASH_REMATCH[1]}"
          scope="${BASH_REMATCH[3]:-}"
          subject="${BASH_REMATCH[5]}"

          if [[ ! "$type" =~ $allowed_types ]]; then
            echo "Invalid PR title type: $type"
            echo "Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            fail "Invalid PR title type: $type"
          fi

          if [[ "$scope" =~ [A-Z] ]]; then
            echo "Invalid PR title scope: $scope"
            echo "Scope must not contain uppercase characters."
            fail "Invalid PR title scope: $scope"
          fi

          {
            echo "type=$type"
            echo "scope=$scope"
            echo "subject=$subject"
            echo "error_message="
          } >> "$GITHUB_OUTPUT"
